# PR and main checks (ADR-0009). One job runs the same `pnpm check` as local
# development, then synthesises the CDK app (ARCH-4). No deploy job: the owner deploys.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: each push must finish its migration check for its own range.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: interval
          POSTGRES_PASSWORD: interval
          POSTGRES_DB: interval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interval -d interval"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # Queues (ADR-0014): the BullMQ contract tests run against a real Valkey.
      valkey:
        image: valkey/valkey:8.1.9-alpine@sha256:4934d214fd7e091d4ee77b398945b3fd62c6dd0ac71d8b79e2e3cbad8364f3b1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      CI: "true"
      DATABASE_URL: postgres://interval:interval@localhost:5432/interval?sslmode=disable
      VALKEY_URL: redis://localhost:6379
      # Private files (DB-6, P2-W11-S01): SeaweedFS as S3, as locally (ADR-0011).
      PRIVATE_CONTENT_BUCKET: interval-private
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://localhost:8333
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      # ADR-0022: the Tesseract container, built from deploy/ocr in a step.
      OCR_URL: http://localhost:8884
      DBMATE_VERSION: v2.37.0
      DBMATE_SHA256: f855e99a0f0a81322014bf686b1cb820d2b4d8074e4eadafd64b851b80ecb15a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migration check diffs against the base commit
          persist-credentials: false # nothing after checkout needs the token

      # Services can't take a command, and SeaweedFS needs one to serve S3.
      - name: Start SeaweedFS
        run: |
          docker run -d -p 8333:8333 chrislusf/seaweedfs:4.50 server -s3 -dir=/data
          for _ in $(seq 60); do curl -sf -o /dev/null localhost:8333 && exit 0; sleep 1; done
          exit 1

      - name: Start the OCR service
        run: |
          docker build -t interval-ocr deploy/ocr
          docker run -d -p 8884:8080 --memory 512m interval-ocr
          for _ in $(seq 60); do curl -sf -o /dev/null localhost:8884/health && exit 0; sleep 1; done
          exit 1

      # corepack first, so setup-node finds the pinned pnpm and caches its store.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install TS dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Python dependencies
        run: uv sync --all-packages --locked

      # The game server (ADR-0033): gofmt, vet and tests run inside `pnpm check`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The image's builder (services/game/Dockerfile); go.mod's 1.24 is the minimum.
          go-version: "1.27.3"
          cache: false # no dependencies yet

      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  /usr/local/bin/dbmate" | sha256sum --check
          chmod +x /usr/local/bin/dbmate

      - name: Merged migrations are unchanged (ADR-0002)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit (new branch); skipping."
          else
            scripts/check-migrations-immutable.sh "$BASE" "$MODE"
          fi

      - name: Format, lint, typecheck, tests, db:check
        run: pnpm check

      - name: CDK synth (no credentials; ARCH-4)
        env:
          CDK_DISABLE_CLI_TELEMETRY: "true"
        run: pnpm --filter @interval/infra synth

  # EXEC-1, Q-P5-03 (P5-W28-S04): the execution engine's red-team suite, on the runner's
  # Docker (runc; gVisor is checked on an execution host). Not required: a red run is
  # read and acted on, but it doesn't block main.
  redteam:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Go's runner image
        run: docker build -q -t interval-exec-go:1 services/exec/images/go

      # The engine bounds each docker call at 30 s: a cold pull of the compilers' images
      # (gcc is over 1 GB) must not happen inside a run.
      - name: Pull the language images
        run: |
          jq -r '.[] | select(.build == null) | .image' services/exec/engine/images.json \
            | sort -u | xargs -r -n1 docker pull -q

      - name: Engine integration tests and the red-team suite
        working-directory: services/exec
        env:
          EXEC_INTEGRATION: "1"
        # One package at a time: the timing attacks mustn't share the runner's CPUs.
        run: go test -p 1 -count=1 -v ./engine/ ./redteam/
