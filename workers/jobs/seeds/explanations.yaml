# Card explanations (ADR-0025, Q-P2-45): one per card at most, filled only from stored
# data. PROVISIONAL: drafted 2026-10-29 for the owner's review.
#
# Categories (which the card's top ranking reason picks):
#   project  technology, concept   the fallback until the AI project line exists
#   goal     goal, concept         the concept is the reason for the pick
#   concept  concept, prerequisite level- and break-length-led cards; a graph fact
#   topic    topic
#   fresh    source
#   trusted  source
# A template is used only when every {placeholder} in it has a value. The choice is a
# stable hash of the item, so a card's wording doesn't change between refreshes.
version: 1
templates:
  - {id: project-1, category: project, text: "Uses {technology}, like your projects: picked for {concept}."}
  - {id: project-2, category: project, text: "Picked for the stack you use: {technology} ({concept})."}
  - {id: project-3, category: project, text: "{technology} is in your projects; this one is picked for {concept}."}
  - {id: goal-1, category: goal, text: "Toward your goal: {goal} ({concept})."}
  - {id: goal-2, category: goal, text: "Picked for your goal to {goal}: {concept}."}
  - {id: goal-3, category: goal, text: "Part of your goal to {goal}, through {concept}."}
  - {id: concept-1, category: concept, text: "{concept} builds on {prerequisite}."}
  - {id: concept-2, category: concept, text: "{concept} comes after {prerequisite} in Interval's concept map."}
  - {id: topic-1, category: topic, text: "On {topic}, a topic you chose."}
  - {id: topic-2, category: topic, text: "Picked for your interest in {topic}."}
  - {id: fresh-1, category: fresh, text: "New this week from {source}."}
  - {id: fresh-2, category: fresh, text: "Fresh from {source}: published this week."}
  - {id: trusted-1, category: trusted, text: "From {source}, one of the most trusted sources here."}
  - {id: trusted-2, category: trusted, text: "{source} is among the highest-rated sources here."}
