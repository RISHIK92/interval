# Pronunciation dictionary (TTS-2, Q-P4-10, P4-W22-S02). `load-pronunciations` syncs it
# into the pronunciation table; explainer scripts say each term this way before TTS.
# Terms added on /admin/pronunciations live in the database and a reload leaves them.
#
# PROVISIONAL (2026-11-09): Claude drafted these as a starting list. NOT owner-approved
# yet; the owner curates this file.
#
# term: how to say it (plain words a voice reads well; matched as a whole word, any case,
# also inside joined words such as JSON-RPC). A term a voice already says well, or an
# ordinary English word (cap, raft), needs no entry. Spell letters out ("ay P I"): a
# lone "A" is read as the article.
