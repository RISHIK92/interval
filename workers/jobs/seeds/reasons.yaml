# Card explanations (ADR-0027): one plain sentence per card, the first that holds of
# project, goal, exploration pick, fresh, trusted; else a neutral phrase. PROVISIONAL
# copy, owner-reviewed in ADR-0027's appendix (2026-10-29).
#
# {fact} is a fact from the ranking. Each category's templates must use exactly its
# facts (the loader checks):
#   project   repositories, concept; technology optional
#   goal      concept                 (templates per goal)
#   explore   none                    only on a topic exploration pick (REC-4)
#   fresh     source                  only when published within 7 days
#   trusted   source                  only for a source rated 4 or 5
#   neutral   none                    any other card
# No verb follows {concept} directly: concept names may be singular or plural. The
# choice is a stable hash of the card and its facts, so wording changes only when the
# facts do.

project:
  - "Relevant to the {technology} in {repositories}: {concept}."
  - "In {repositories}, you use {technology}. This one covers {concept}."
  - "Spotted {technology} in {repositories}. This one's about {concept}."
  - "Homework for {repositories}: {concept}."

goal:
  system-design-interviews:
    - "System design interviews ask about {concept}."
    - "Good prep for system design interviews: {concept}."
    - "An interviewer will ask about {concept} someday. Be ready."
  stack-i-use:
    - "Part of the stack you use: {concept}."
    - "For the stack you use: {concept}."

explore:
  - "A new direction to explore."
  - "Something different to dig into."
  - "Expand your perspective."
  - "Explore beyond your usual topics."
  - "Broaden your technical horizons."
  - "Discover a different approach."
  - "Take a look beyond the familiar."

fresh:
  - "New this week from {source}."
  - "Fresh from {source} this week."

trusted:
  - "From {source}, one of the best-rated sources here."
  - "{source} is one of the best-rated sources here."

neutral:
  - "Worth exploring."
  - "A fresh angle to consider."
  - "An idea worth investigating."
  - "Worth a look."
  - "Could be useful."
