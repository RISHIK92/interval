# Concept graph seed (DB-2, §3.1, Q-P1-03, Q-P1-04). `load-concepts` syncs it into the
# concept tables. The owner edits and approves this file; bump `version` on every change.
#
# PROVISIONAL (2026-10-27): Claude drafted the first 72 on 2026-10-26 and expanded the
# list to about 250 concepts on 2026-10-27. NOT owner-approved yet.
# Aliases drafted by Claude 2026-10-27, not owner-approved.
#
# Fields per concept:
#   slug (required, kebab-case, the key; never reuse a retired one), name, topic
#   (system-design | databases | distributed-systems | backend), description (one line),
#   prerequisites / related / applied_in: slugs (edges "prerequisite of", "related to",
#   "applied in"; a prerequisite is learned first).
#   retired: true keeps the concept for existing tags but stops new use;
#   merged_into: slug of the concept that replaced it (implies retired).
#   aliases: other phrases (whole words, any case) that shortlist the concept for tagging.
# A concept removed from this file is retired, never deleted.

version: 3

