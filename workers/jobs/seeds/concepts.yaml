  - slug: causal-consistency
    name: Causal consistency
    topic: distributed-systems
    description: Everyone sees causally related writes in the same order.
    prerequisites: [consistency-models, happens-before]
  - slug: monotonic-reads
    name: Monotonic reads
    topic: distributed-systems
