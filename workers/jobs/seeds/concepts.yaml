  - slug: failure-detection
    name: Failure detection
    topic: distributed-systems
    description: Deciding a node is down from missed heartbeats and timeouts.
    prerequisites: [timeouts]
  - slug: metastable-failures
    name: Metastable failures
    topic: distributed-systems
    description: Overload that sustains itself, such as retry storms, after the trigger is gone.
