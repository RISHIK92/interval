  - slug: hybrid-logical-clocks
    name: Hybrid logical clocks
    topic: distributed-systems
    description: Timestamps that stay close to wall time while still respecting causality.
    prerequisites: [lamport-clocks, clock-skew-and-ntp]
  - slug: truetime
    name: TrueTime and commit wait
    topic: distributed-systems
    description: Spanner's bounded clock uncertainty, used to make commits externally consistent.
