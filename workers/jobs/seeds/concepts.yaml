  - slug: clock-skew-and-ntp
    name: Clock skew and NTP
    topic: distributed-systems
    description: How physical clocks drift, how NTP corrects them, and why timestamps mislead.
    prerequisites: [clocks-and-ordering]
  - slug: lamport-clocks
    name: Lamport clocks
    topic: distributed-systems
    description: Logical timestamps that order events consistently with causality.
    prerequisites: [happens-before]
  - slug: vector-clocks
    name: Vector clocks
    topic: distributed-systems
    description: Per-node counters that tell whether two events are concurrent.
