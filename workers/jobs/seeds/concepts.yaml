# Concept graph seed (DB-2, §3.1, Q-P1-03, Q-P1-04). `load-concepts` syncs it into the
# concept tables. The owner edits and approves this file; bump `version` on every change.
#
# PROVISIONAL (2026-10-27): Claude drafted the first 72 on 2026-10-26 and expanded the
# list to about 250 concepts on 2026-10-27. NOT owner-approved yet.
#
# Fields per concept:
#   slug (required, kebab-case, the key; never reuse a retired one), name, topic
#   (system-design | databases | distributed-systems | backend), description (one line),
#   prerequisites / related / applied_in: slugs (edges "prerequisite of", "related to",
#   "applied in"; a prerequisite is learned first).
#   retired: true keeps the concept for existing tags but stops new use;
#   merged_into: slug of the concept that replaced it (implies retired).
# A concept removed from this file is retired, never deleted.

version: 2

concepts:
  # --- backend -------------------------------------------------------------------
  - slug: http-request-lifecycle
    name: HTTP request lifecycle
    topic: backend
    description: What happens from a client sending a request to it receiving a response.
  - slug: tcp-connection
    name: TCP connections
    topic: backend
    description: Reliable ordered byte streams, the handshake, and what a connection costs.
  - slug: tls-handshake
    name: TLS handshake
    topic: backend
    description: How client and server agree keys and verify identity before sending data.
    prerequisites: [tcp-connection]
  - slug: dns-resolution
    name: DNS resolution
    topic: backend
    description: Turning a name into addresses through resolvers, caches and TTLs.
  - slug: connection-pooling
    name: Connection pooling
    topic: backend
    description: Reusing open connections instead of paying setup cost per request.
    prerequisites: [tcp-connection]
    applied_in: [database-connection-limits]
  - slug: timeouts
    name: Timeouts
    topic: backend
    description: Bounding how long a call may take so failures surface instead of hanging.
    prerequisites: [http-request-lifecycle]
  - slug: retries-with-backoff
    name: Retries with backoff
    topic: backend
    description: Repeating failed calls with growing, jittered delays.
    prerequisites: [timeouts]
    related: [idempotency]
  - slug: idempotency
    name: Idempotency
    topic: backend
    description: Operations that give the same result when applied more than once.
  - slug: idempotency-keys
    name: Idempotency keys
    topic: backend
    description: Client-chosen keys that let a server recognise and dedupe a repeated request.
    prerequisites: [idempotency]
  - slug: rate-limiting
    name: Rate limiting
    topic: backend
    description: Capping how many requests a client may make in a window.
    related: [backpressure]
  - slug: token-bucket
    name: Token bucket
    topic: backend
    description: A rate-limiting algorithm that allows bursts up to a bucket size.
    prerequisites: [rate-limiting]
  - slug: caching
    name: Caching
    topic: backend
    description: Keeping copies of results closer to the reader to save work and latency.
  - slug: cache-invalidation
    name: Cache invalidation
    topic: backend
    description: Deciding when a cached copy is stale and must be dropped or refreshed.
    prerequisites: [caching]
  - slug: cache-stampede
    name: Cache stampede
    topic: backend
    description: Many requests rebuilding the same expired entry at once.
    prerequisites: [caching]
  - slug: message-queues
    name: Message queues
    topic: backend
    description: Decoupling producers from consumers with a durable buffer of messages.
  - slug: at-least-once-delivery
    name: At-least-once delivery
    topic: backend
    description: Delivery that may repeat a message, so consumers must tolerate duplicates.
    prerequisites: [message-queues, idempotency]
  - slug: dead-letter-queues
    name: Dead-letter queues
    topic: backend
    description: Where messages go after repeated failures, for inspection and redrive.
    prerequisites: [message-queues]
  - slug: backpressure
    name: Backpressure
    topic: backend
    description: Slowing producers when consumers cannot keep up.
    prerequisites: [message-queues]
  - slug: observability
    name: Observability
    topic: backend
    description: Understanding a running system from its logs, metrics and traces.
  - slug: distributed-tracing
    name: Distributed tracing
    topic: backend
    description: Following one request across services with propagated trace context.
    prerequisites: [observability]
  - slug: structured-logging
    name: Structured logging
    topic: backend
    description: Logs as machine-readable fields rather than free text.
    prerequisites: [observability]
  - slug: http-methods-and-status-codes
    name: HTTP methods and status codes
    topic: backend
    description: What GET, POST, PUT, PATCH and DELETE promise, and what each status class tells a client.
    prerequisites: [http-request-lifecycle]
    related: [idempotency]
  - slug: http2-and-http3
    name: HTTP/2 and HTTP/3
    topic: backend
    description: Multiplexed streams over one connection, header compression, and QUIC over UDP.
    prerequisites: [http-request-lifecycle, tls-handshake]
    related: [udp]
  - slug: udp
    name: UDP
    topic: backend
    description: Connectionless datagrams, and when losing a packet beats waiting for it.
    related: [tcp-connection]
  - slug: reverse-proxy
    name: Reverse proxies
    topic: backend
    description: A server in front of services that terminates TLS, routes and buffers requests.
    prerequisites: [http-request-lifecycle]
    related: [load-balancing]
  - slug: rest-api-design
    name: REST API design
    topic: backend
    description: Modelling resources, URLs, methods and representations for HTTP APIs.
    prerequisites: [http-methods-and-status-codes]
  - slug: api-versioning
    name: API versioning
    topic: backend
    description: Changing an API without breaking the clients that already call it.
    prerequisites: [rest-api-design]
    related: [schema-evolution]
  - slug: pagination
    name: Pagination
    topic: backend
    description: Returning large result sets in pages with offsets or cursors.
    prerequisites: [rest-api-design]
    related: [indexes]
  - slug: graphql
    name: GraphQL
    topic: backend
    description: A typed query language where clients ask for exactly the fields they need.
    prerequisites: [http-request-lifecycle]
    related: [rest-api-design, n-plus-one-queries]
  - slug: serialization-formats
    name: Serialization formats
    topic: backend
    description: Encoding data as JSON, Protocol Buffers or Avro, and their size and speed trade-offs.
  - slug: grpc
    name: gRPC
    topic: backend
    description: Remote procedure calls over HTTP/2 with Protocol Buffers schemas and streaming.
    prerequisites: [http2-and-http3, serialization-formats]
    related: [rest-api-design]
  - slug: websockets
    name: WebSockets
    topic: backend
    description: Long-lived two-way connections for pushing data to clients.
    prerequisites: [http-request-lifecycle, tcp-connection]
    related: [server-sent-events]
  - slug: server-sent-events
    name: Server-sent events
    topic: backend
    description: One-way streaming of events from server to browser over plain HTTP.
    prerequisites: [http-request-lifecycle]
  - slug: long-polling
    name: Long polling
    topic: backend
    description: Holding a request open until data is ready, as a simpler form of push.
    prerequisites: [http-request-lifecycle]
    related: [websockets]
  - slug: webhooks
    name: Webhooks
    topic: backend
    description: Notifying another system by calling its HTTP endpoint when something happens.
    prerequisites: [http-request-lifecycle]
    related: [idempotency-keys, retries-with-backoff]
  - slug: http-caching-headers
    name: HTTP caching headers
    topic: backend
    description: Cache-Control, ETag and conditional requests that let browsers and proxies reuse responses.
    prerequisites: [caching, http-request-lifecycle]
    related: [cdn]
  - slug: cache-eviction-policies
    name: Cache eviction policies
    topic: backend
    description: LRU, LFU and TTL rules for choosing what to drop when a cache is full.
    prerequisites: [caching]
  - slug: sliding-window-rate-limiting
    name: Sliding window rate limiting
    topic: backend
    description: Counting requests over a moving window to avoid bursts at fixed window edges.
    prerequisites: [rate-limiting]
    related: [token-bucket]
  - slug: authentication-vs-authorization
    name: Authentication and authorization
    topic: backend
    description: Proving who a caller is versus deciding what they may do.
  - slug: session-management
    name: Session management
    topic: backend
    description: Keeping a user signed in across requests with cookies and server-side sessions.
    prerequisites: [authentication-vs-authorization]
    related: [jwt]
  - slug: jwt
    name: JSON Web Tokens
    topic: backend
    description: Signed, self-contained tokens carrying claims, and the cost of not being able to revoke them.
    prerequisites: [authentication-vs-authorization]
  - slug: oauth2-and-oidc
    name: OAuth 2.0 and OpenID Connect
    topic: backend
    description: Delegated authorization and sign-in through a third-party identity provider.
    prerequisites: [authentication-vs-authorization, jwt]
  - slug: password-hashing
    name: Password hashing
    topic: backend
    description: Storing passwords with slow salted hashes such as bcrypt, scrypt and Argon2.
    prerequisites: [authentication-vs-authorization]
  - slug: rbac
    name: Role-based access control
    topic: backend
    description: Granting permissions through roles rather than to each user directly.
    prerequisites: [authentication-vs-authorization]
  - slug: sql-injection
    name: SQL injection
    topic: backend
    description: Untrusted input executed as SQL, and why parameterised queries stop it.
    prerequisites: [relational-model]
  - slug: cross-site-scripting
    name: Cross-site scripting (XSS)
    topic: backend
    description: Script injected into pages other users load, and output encoding and CSP as defences.
    prerequisites: [http-request-lifecycle]
  - slug: csrf
    name: Cross-site request forgery (CSRF)
    topic: backend
    description: Tricking a signed-in browser into sending a request, and tokens and SameSite cookies as defences.
    prerequisites: [session-management]
    related: [cors]
  - slug: cors
    name: CORS
    topic: backend
    description: How browsers let a page call another origin only when that origin allows it.
    prerequisites: [http-request-lifecycle]
  - slug: secrets-management
    name: Secrets management
    topic: backend
    description: Storing, rotating and injecting credentials without putting them in code or images.
  - slug: encryption-at-rest-and-in-transit
    name: Encryption at rest and in transit
    topic: backend
    description: Protecting stored data with managed keys and moving data with TLS.
    prerequisites: [tls-handshake]
    related: [secrets-management]
  - slug: concurrency-vs-parallelism
    name: Concurrency and parallelism
    topic: backend
    description: Interleaving many tasks versus running them at the same time on many cores.
  - slug: threads-and-processes
    name: Threads and processes
    topic: backend
    description: Operating system units of execution, what they share, and what switching between them costs.
  - slug: event-loop
    name: Event loops and async I/O
    topic: backend
    description: Serving many connections on one thread by reacting to I/O readiness.
    prerequisites: [concurrency-vs-parallelism]
    related: [threads-and-processes]
  - slug: race-conditions
    name: Race conditions
    topic: backend
    description: Bugs where the result depends on the timing of concurrent operations.
    prerequisites: [concurrency-vs-parallelism]
    related: [lost-updates]
  - slug: locks-and-mutexes
    name: Locks and mutexes
    topic: backend
    description: Serialising access to shared in-memory state, and the contention that causes.
    prerequisites: [race-conditions]
    related: [deadlocks]
  - slug: thread-pools
    name: Thread pools
    topic: backend
    description: Reusing a fixed set of workers to bound concurrency and queue the rest.
    prerequisites: [threads-and-processes]
    related: [backpressure]
  - slug: garbage-collection
    name: Garbage collection
    topic: backend
    description: How managed runtimes reclaim memory, and how collection pauses show up as latency spikes.
    related: [tail-latency]
  - slug: publish-subscribe
    name: Publish-subscribe
    topic: backend
    description: Fanning each message out to every interested subscriber.
    prerequisites: [message-queues]
  - slug: message-ordering
    name: Message ordering
    topic: backend
    description: When consumers see messages in the order they were sent, and what breaks it.
    prerequisites: [message-queues]
    related: [partitioning]
  - slug: background-jobs
    name: Background jobs
    topic: backend
    description: Moving slow work out of the request path into workers fed by a queue.
    prerequisites: [message-queues]
  - slug: metrics
    name: Metrics
    topic: backend
    description: Counters, gauges and histograms aggregated over time, and why percentiles need histograms.
    prerequisites: [observability]
    related: [tail-latency]
  - slug: health-checks
    name: Health checks
    topic: backend
    description: Liveness and readiness endpoints that let load balancers and orchestrators route and restart.
    related: [load-balancing]
  - slug: graceful-shutdown
    name: Graceful shutdown
    topic: backend
    description: Draining in-flight requests and jobs before a process exits.
    related: [health-checks]

  # --- databases -----------------------------------------------------------------
  - slug: relational-model
    name: Relational model
    topic: databases
    description: Data as tables of rows related by keys and queried declaratively.
  - slug: indexes
    name: Indexes
    topic: databases
    description: Auxiliary structures that find rows without scanning the whole table.
    prerequisites: [relational-model]
  - slug: b-tree-index
    name: B-tree indexes
    topic: databases
    description: The balanced tree behind most database indexes and range scans.
    prerequisites: [indexes]
  - slug: lsm-tree
    name: LSM trees
    topic: databases
    description: Write-optimised storage that buffers writes in memory and merges sorted files.
    prerequisites: [indexes]
    related: [b-tree-index]
  - slug: query-planning
    name: Query planning
    topic: databases
    description: How a database chooses an execution plan from statistics and indexes.
    prerequisites: [indexes]
  - slug: transactions
    name: Transactions
    topic: databases
    description: Grouping operations so they commit or roll back together.
    prerequisites: [relational-model]
  - slug: acid
    name: ACID
    topic: databases
    description: Atomicity, consistency, isolation and durability guarantees of transactions.
    prerequisites: [transactions]
  - slug: isolation-levels
    name: Isolation levels
    topic: databases
    description: How much concurrent transactions can see of each other's changes.
    prerequisites: [transactions]
  - slug: mvcc
    name: MVCC
    topic: databases
    description: Multi-version concurrency control, letting readers see a snapshot without locks.
    prerequisites: [isolation-levels]
  - slug: write-ahead-log
    name: Write-ahead log
    topic: databases
    description: Recording changes durably before applying them, for crash recovery.
    prerequisites: [transactions]
  - slug: database-connection-limits
    name: Database connection limits
    topic: databases
    description: Why a database caps connections and what happens when clients exceed it.
  - slug: deadlocks
    name: Deadlocks
    topic: databases
    description: Transactions each waiting on a lock the other holds.
    prerequisites: [transactions]
  - slug: schema-migrations
    name: Schema migrations
    topic: databases
    description: Changing a live schema safely, step by step.
    prerequisites: [relational-model]
  - slug: normalization
    name: Normalization
    topic: databases
    description: Structuring tables to remove redundancy, and when to denormalize.
    prerequisites: [relational-model]
  - slug: vector-search
    name: Vector search
    topic: databases
    description: Finding nearest neighbours among embeddings, exactly or approximately.
    prerequisites: [indexes]
  - slug: change-data-capture
    name: Change data capture
    topic: databases
    description: Streaming a database's committed changes to other systems.
    prerequisites: [write-ahead-log]
  - slug: keys-and-constraints
    name: Keys and constraints
    topic: databases
    description: Primary keys, foreign keys, unique and check constraints that keep data valid.
    prerequisites: [relational-model]
  - slug: sql-joins
    name: SQL joins
    topic: databases
    description: "Combining rows from tables by matching keys: inner, outer and self joins."
    prerequisites: [relational-model]
  - slug: join-algorithms
    name: Join algorithms
    topic: databases
    description: Nested loop, hash and merge joins, and when the planner picks each.
    prerequisites: [sql-joins, query-planning]
  - slug: window-functions
    name: Window functions
    topic: databases
    description: Running totals, ranks and row-to-row comparisons without collapsing rows.
    prerequisites: [relational-model]
  - slug: n-plus-one-queries
    name: N+1 queries
    topic: databases
    description: One query per row of an earlier result, usually from an ORM, and how to batch it.
    prerequisites: [sql-joins]
  - slug: composite-indexes
    name: Composite indexes
    topic: databases
    description: Indexes on several columns, and why column order decides which queries they serve.
    prerequisites: [b-tree-index]
  - slug: covering-indexes
    name: Covering indexes
    topic: databases
    description: Indexes holding every column a query needs, so the table itself is never read.
    prerequisites: [composite-indexes]
  - slug: clustered-index
    name: Clustered and secondary indexes
    topic: databases
    description: Storing rows in index order versus pointing at them from a separate structure.
    prerequisites: [b-tree-index]
  - slug: hash-index
    name: Hash indexes
    topic: databases
    description: Indexing by hashed key for exact-match lookups, giving up range scans.
    prerequisites: [indexes]
    related: [b-tree-index]
  - slug: inverted-index
    name: Inverted indexes
    topic: databases
    description: Mapping each term to the documents that contain it.
    prerequisites: [indexes]
  - slug: full-text-search
    name: Full-text search
    topic: databases
    description: Tokenising, stemming and ranking documents by relevance to a text query.
    prerequisites: [inverted-index]
    related: [vector-search]
  - slug: geospatial-indexes
    name: Geospatial indexes
    topic: databases
    description: Geohashes, quadtrees and R-trees for finding things near a point.
    prerequisites: [indexes]
  - slug: approximate-nearest-neighbor
    name: Approximate nearest neighbour indexes
    topic: databases
    description: HNSW and IVF indexes that trade a little recall for fast vector search.
    prerequisites: [vector-search]
  - slug: bloom-filters
    name: Bloom filters
    topic: databases
    description: Compact probabilistic sets that answer "definitely not" or "maybe".
    applied_in: [lsm-tree]
  - slug: sstables-and-compaction
    name: SSTables and compaction
    topic: databases
    description: Immutable sorted files and the background merging that reclaims space.
    prerequisites: [lsm-tree]
  - slug: write-amplification
    name: Write and read amplification
    topic: databases
    description: Extra bytes written or read per logical operation, and how storage engines trade them.
    prerequisites: [lsm-tree, b-tree-index]
  - slug: buffer-pool
    name: Buffer pool
    topic: databases
    description: The database's own page cache and how it decides which pages stay in memory.
    prerequisites: [b-tree-index, caching]
    related: [cache-eviction-policies]
  - slug: durability-and-fsync
    name: Durability and fsync
    topic: databases
    description: What it takes for a committed write to survive power loss, and why fsync is slow.
    prerequisites: [write-ahead-log]
  - slug: table-statistics
    name: Table statistics and cardinality estimation
    topic: databases
    description: How row-count estimates drive plan choice, and how stale statistics produce bad plans.
    prerequisites: [query-planning]
  - slug: explain-analyze
    name: Reading EXPLAIN plans
    topic: databases
    description: Reading a plan's estimated and actual costs to find why a query is slow.
    prerequisites: [query-planning]
    related: [table-statistics]
  - slug: materialized-views
    name: Materialized views
    topic: databases
    description: Precomputed query results stored and refreshed as the base data changes.
    prerequisites: [relational-model]
    related: [caching]
  - slug: read-committed
    name: Read committed
    topic: databases
    description: Never seeing or overwriting uncommitted data, and the anomalies it still allows.
    prerequisites: [isolation-levels]
  - slug: snapshot-isolation
    name: Snapshot isolation
    topic: databases
    description: Each transaction reads a consistent snapshot of the database as of its start.
    prerequisites: [mvcc]
  - slug: serializability
    name: Serializability
    topic: databases
    description: Concurrent transactions behaving as if they ran one at a time.
    prerequisites: [isolation-levels]
    related: [linearizability]
  - slug: lost-updates
    name: Lost updates
    topic: databases
    description: Two read-modify-write cycles where one silently overwrites the other.
    prerequisites: [isolation-levels]
    related: [optimistic-locking]
  - slug: write-skew
    name: Write skew and phantoms
    topic: databases
    description: Transactions reading overlapping data and writing different rows, breaking an invariant.
    prerequisites: [snapshot-isolation]
  - slug: row-and-table-locks
    name: Row-level and table-level locks
    topic: databases
    description: Lock granularity, shared versus exclusive locks, and waiting on locks.
    prerequisites: [transactions]
    related: [deadlocks]
  - slug: two-phase-locking
    name: Two-phase locking
    topic: databases
    description: Pessimistic serializability by holding locks until commit.
    prerequisites: [serializability, row-and-table-locks]
  - slug: serializable-snapshot-isolation
    name: Serializable snapshot isolation
    topic: databases
    description: Optimistic serializability that aborts transactions whose reads went stale.
    prerequisites: [snapshot-isolation, serializability]
  - slug: optimistic-locking
    name: Optimistic and pessimistic locking
    topic: databases
    description: Checking a version number at write time versus locking rows up front.
    prerequisites: [transactions]
  - slug: vacuum-and-bloat
    name: Vacuum and table bloat
    topic: databases
    description: Reclaiming the dead row versions MVCC leaves behind.
    prerequisites: [mvcc]
  - slug: backups-and-point-in-time-recovery
    name: Backups and point-in-time recovery
    topic: databases
    description: Restoring a database to any moment from a base backup plus archived WAL.
    prerequisites: [write-ahead-log]
  - slug: physical-and-logical-replication
    name: Physical and logical replication
    topic: databases
    description: Shipping disk-level changes versus row-level changes between databases.
    prerequisites: [write-ahead-log, leader-follower-replication]
    related: [change-data-capture]
  - slug: read-replicas
    name: Read replicas
    topic: databases
    description: Sending reads to followers to scale them, and the staleness that brings.
    prerequisites: [leader-follower-replication]
    related: [replication-lag]
  - slug: schema-evolution
    name: Schema evolution
    topic: databases
    description: Changing stored and message schemas while old and new readers and writers coexist.
    prerequisites: [serialization-formats]
    related: [schema-migrations, api-versioning]
  - slug: oltp-vs-olap
    name: OLTP and OLAP
    topic: databases
    description: Transaction processing versus analytics workloads, and why they want different stores.
    prerequisites: [relational-model]
  - slug: column-oriented-storage
    name: Column-oriented storage
    topic: databases
    description: Storing each column together so analytical scans read only the columns they need.
    prerequisites: [oltp-vs-olap]
  - slug: data-warehouses
    name: Data warehouses
    topic: databases
    description: Separate analytical stores with star schemas, loaded from operational databases.
    prerequisites: [column-oriented-storage]
  - slug: key-value-stores
    name: Key-value stores
    topic: databases
    description: The simplest data model, get and put by key, and how far it scales.
  - slug: document-databases
    name: Document databases
    topic: databases
    description: Storing self-contained JSON-like documents, and where joins and updates get hard.
    related: [relational-model]
  - slug: wide-column-stores
    name: Wide-column stores
    topic: databases
    description: Cassandra- and Bigtable-style rows of sparse columns grouped by partition key.
    prerequisites: [key-value-stores, lsm-tree]
  - slug: graph-databases
    name: Graph databases
    topic: databases
    description: Vertices and edges with traversal queries for highly connected data.
  - slug: time-series-databases
    name: Time-series databases
    topic: databases
    description: Storage tuned for append-mostly timestamped data, downsampling and retention.
    related: [column-oriented-storage, lsm-tree]
  - slug: in-memory-data-stores
    name: In-memory data stores
    topic: databases
    description: Redis-style stores that keep data in RAM, their data structures, and how they persist.
    prerequisites: [key-value-stores]
    related: [caching]
  - slug: sql-vs-nosql
    name: SQL vs NoSQL
    topic: databases
    description: Choosing between relational and non-relational stores by access pattern and consistency need.
    prerequisites: [relational-model, document-databases, key-value-stores]

  # --- distributed systems -------------------------------------------------------
  - slug: network-partitions
    name: Network partitions
    topic: distributed-systems
    description: Parts of a system that cannot reach each other while both keep running.
    prerequisites: [tcp-connection]
  - slug: cap-theorem
    name: CAP theorem
    topic: distributed-systems
    description: Choosing between consistency and availability during a partition.
    prerequisites: [network-partitions]
  - slug: replication
    name: Replication
    topic: distributed-systems
    description: Keeping copies of data on several nodes for durability and read scale.
  - slug: leader-follower-replication
    name: Leader-follower replication
    topic: distributed-systems
    description: One node takes writes and streams them to followers.
    prerequisites: [replication]
  - slug: replication-lag
    name: Replication lag
    topic: distributed-systems
    description: How far a follower trails its leader, and the anomalies that causes.
    prerequisites: [leader-follower-replication]
  - slug: read-your-writes
    name: Read-your-writes consistency
    topic: distributed-systems
    description: A client always sees its own earlier writes.
    prerequisites: [replication-lag]
  - slug: consistency-models
    name: Consistency models
    topic: distributed-systems
    description: The spectrum from linearizable to eventual consistency.
    prerequisites: [replication]
  - slug: linearizability
    name: Linearizability
    topic: distributed-systems
    description: Every operation appears to take effect at one instant between its call and return.
    prerequisites: [consistency-models]
  - slug: eventual-consistency
