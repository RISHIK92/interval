  - slug: distributed-transactions
    name: Distributed transactions
    topic: distributed-systems
    description: Committing atomically across nodes, as with two-phase commit.
    prerequisites: [transactions, network-partitions]
  - slug: saga-pattern
    name: Saga pattern
