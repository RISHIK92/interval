    related: [backpressure]
  - slug: failure-models
    name: Failure models
    topic: distributed-systems
    description: Crash-stop, crash-recovery and Byzantine nodes; synchronous and asynchronous networks.
    prerequisites: [network-partitions]
  - slug: two-generals-problem
    name: Two Generals problem
    topic: distributed-systems
    description: Why two parties can never be certain they agree over an unreliable link.
    prerequisites: [network-partitions]
  - slug: pacelc
    name: PACELC
    topic: distributed-systems
    description: "Extending CAP: without a partition, a system still trades latency against consistency."
    prerequisites: [cap-theorem]
  - slug: happens-before
    name: Causality and happens-before
