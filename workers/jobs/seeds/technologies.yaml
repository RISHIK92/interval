  # --- HTTP clients ------------------------------------------------------------------
  - slug: http-clients
    name: HTTP clients
    packages: { npm: [axios, got, ky], pypi: [httpx, requests, aiohttp] }
    concepts: [timeouts, retries-with-backoff, connection-pooling, idempotency]
  - slug: retry-libraries
    name: Retry libraries
    packages:
      { npm: [p-retry, async-retry], pypi: [tenacity, backoff], go: ["github.com/sethvargo/go-retry*", "github.com/cenkalti/backoff*"] }
    concepts: [retries-with-backoff, idempotency, metastable-failures]

