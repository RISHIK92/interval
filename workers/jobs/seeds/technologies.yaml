# Technology seed (PER-4, §5H, P2-W12-S03). `load-technologies` syncs it into the
# technology tables. The owner edits and approves this file; bump `version` on every
# change. Dependencies in connected repositories resolve to technologies by package
# name, and technologies to the concepts they make worth learning.
#
# PROVISIONAL (2026-10-29): Claude drafted these 61 and added 10 after review (2026-10-29). NOT owner-approved yet.
#
# Fields per technology:
#   slug (required, kebab-case, the key; never reuse a retired one), name,
#   packages: per ecosystem (npm, pypi, go), package names; one ending in `*` is a
#     prefix (`@nestjs/*`; `github.com/jackc/pgx*` for Go's /vN module paths),
#   concepts: 1-4 concept slugs from concepts.yaml.
# A technology removed from this file is retired, never deleted. Technologies accepted
# from suggestions (the admin page) live in the database and are left alone here.

version: 1

technologies:
  # --- web frameworks and servers ---------------------------------------------------
  - slug: nextjs
    name: Next.js
    packages: { npm: [next] }
    concepts: [http-caching-headers, cdn, http-request-lifecycle, stateless-services]
  - slug: react
    name: React
    packages: { npm: [react, react-dom] }
    concepts: [cross-site-scripting, http-caching-headers]
  - slug: express
    name: Express
    packages: { npm: [express] }
    concepts: [http-request-lifecycle, rest-api-design, rate-limiting, cors]
  - slug: nestjs
    name: NestJS
    packages: { npm: ["@nestjs/*"] }
    concepts: [rest-api-design, monoliths-and-microservices, health-checks]
  - slug: fastify
    name: Fastify
    packages: { npm: [fastify] }
    concepts: [http-request-lifecycle, event-loop, rest-api-design]
  - slug: hono-koa
    name: Hono and Koa
    packages: { npm: [hono, koa] }
    concepts: [http-request-lifecycle, rest-api-design]
  - slug: vue-svelte
    name: Vue, Nuxt and SvelteKit
    packages: { npm: [vue, nuxt, "@sveltejs/kit"] }
    concepts: [cross-site-scripting, http-caching-headers]
  - slug: fiber
    name: Fiber
    packages: { go: ["github.com/gofiber/fiber*", github.com/gorilla/mux] }
    concepts: [http-request-lifecycle, rest-api-design]
  - slug: gunicorn
    name: Gunicorn
    packages: { pypi: [gunicorn] }
    concepts: [threads-and-processes, graceful-shutdown]
  - slug: fastapi
    name: FastAPI
    packages: { pypi: [fastapi] }
    concepts: [rest-api-design, event-loop, serialization-formats, api-versioning]
  - slug: starlette-uvicorn
    name: Starlette and Uvicorn
    packages: { pypi: [starlette, uvicorn, sse-starlette] }
    concepts: [event-loop, server-sent-events, graceful-shutdown]
  - slug: django
    name: Django
    packages: { pypi: [django, djangorestframework] }
    concepts: [schema-migrations, session-management, csrf, n-plus-one-queries]
  - slug: flask
    name: Flask
    packages: { pypi: [flask] }
    concepts: [http-request-lifecycle, rest-api-design, session-management]
  - slug: gin
    name: Gin
    packages: { go: [github.com/gin-gonic/gin] }
    concepts: [http-request-lifecycle, rest-api-design, rate-limiting]
  - slug: chi
    name: chi
    packages: { go: ["github.com/go-chi/chi*"] }
