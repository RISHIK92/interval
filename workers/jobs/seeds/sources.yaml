# Seed sources (Q-P1-02, ING-6). The owner edits this file; `load-sources` syncs it into
# the source table. Fields per source:
#   name (required, the key), homepage, feed_url (sources without one are skipped in
#   Phase 1), rights_profile (required: metadata_only | excerpt | full_text_internal |
#   full_text_display, ING-2), moments_enabled (full_text_* only), paywalled,
#   quality_score (optional, 1-5, Q-P1-37), topics (kebab-case).
# Removing a source disables it (no more polling); its items stay in the feed.
# The first 10 were accepted in docs/proposals/seed-sources.md (2026-10-25).

