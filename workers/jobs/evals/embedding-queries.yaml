# Embeddings eval queries (ADR-0007, Q-P1-27, P1-W3-S04): `eval-embeddings --queries`
# reads this file.
#
# DRAFT labels by Claude, 2026-10-27. NOT owner-checked: the owner corrects them before
# any eval result is trusted. Picked from the local database's full-text items as
# ingested on 2026-10-27.
#
# Each query is what a learner might type; `relevant` names the moment(s) that answer
# it by the item's canonical URL and the moment's heading (null for the intro). The
# pool is every moment of every item named here plus the distractor items, so sibling
# sections of a labelled article are hard negatives. The eval refuses a pool under 50
# moments, a heading that matches no moment, and two moments of one item sharing a
# heading.

