packages:
  - apps/*
  - packages/*
  - infra

engineStrict: true

# The owner's rule (2026-10-26, made repo-wide 2026-11-07): no package version under two
# weeks old, transitive ones included. Expo's ranges otherwise pull in days-old modules
# (P4-W19-S01: one didn't compile under Xcode 26.2).
minimumReleaseAge: 20160

# Build scripts we skip on purpose (pnpm fails on unreviewed ones).
# unrs-resolver (via eslint-config-next) ships prebuilt binaries.
# msgpackr-extract (via bullmq) ships prebuilt binaries too, and msgpackr falls back to
# plain JS without it.
# @parcel/watcher (via @expo/cli's file watching) ships prebuilt binaries per platform
# as optional dependencies; its script only builds from source when none fits.
# @vscode/vsce-sign (via @vscode/vsce, P7-W47) copies its platform's signing binary into
# place; only signing and verifying a published extension use it, never `vsce package`.
# esbuild (P7-W47, bundles the VS Code extension) gets its binary from its platform's
# optional dependency; its script only checks that binary.
allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: false
  "@parcel/watcher": false
  unrs-resolver: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@next/env@16.4.6"
  - "@next/eslint-plugin-next@16.4.6"
  - "@next/swc-darwin-arm64@16.4.6"
  - "@next/swc-darwin-x64@16.4.6"
  - "@next/swc-linux-arm64-gnu@16.4.6"
  - "@next/swc-linux-arm64-musl@16.4.6"
  - "@next/swc-linux-x64-gnu@16.4.6"
  - "@next/swc-linux-x64-musl@16.4.6"
  - "@next/swc-win32-arm64-msvc@16.4.6"
  - "@next/swc-win32-x64-msvc@16.4.6"
  - eslint-config-next@16.4.6
  - next@16.4.6
