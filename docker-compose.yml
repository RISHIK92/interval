services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: interval
      POSTGRES_PASSWORD: interval
      POSTGRES_DB: interval
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interval -d interval"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3 stand-in (Q-P1-26). Replaces MinIO, whose images are no longer published.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data

  # OCR for scanned book pages (ADR-0022): Tesseract, one page at a time, 512 MB cap.
  ocr:
    build: ./deploy/ocr
    mem_limit: 512m
    ports:
      - "127.0.0.1:8884:8080"

  # Queues (BullMQ) and real-time state, ADR-0014. AOF every second, like the VM.
  valkey:
    image: valkey/valkey:8.1.9-alpine@sha256:4934d214fd7e091d4ee77b398945b3fd62c6dd0ac71d8b79e2e3cbad8364f3b1
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  seaweedfs-data:
  valkey-data:
